# Use instead of Ctrl-b
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -g escape-time 0
set -g extended-keys on
set -g repeat-time 1000
set -g history-limit 10000
# Start windows/panes in current directory
set -g detach-on-destroy off

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind f display-popup -E -w 80% -h 80% -d "#{pane_current_path}" -b rounded -S "fg=#fe8019" -T " floating shell "

# Navigate panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Mouse mode
set -g mouse on

# Window indexing starts at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Reload config
bind r source-file ~/.tmux.conf

# Windows
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind w list-windows

# True colors support
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"
set -g focus-events on

# Status bar (vim-tpipeline embeds nvim statusline here)
set -g status-position top
set -g status-style bg=default
set -g status-justify absolute-centre
set -g status-left-length 99
set -g status-right-length 99
set -g status-left ""
set -g status-right "#[fg=white,bright]#S"

# Borders
set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-style fg=#665c54
set -g pane-active-border-style fg=#a89984
