# Use instead of Ctrl-b
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -g escape-time 0
set -g extended-keys on
set -g repeat-time 1000
set -g history-limit 10000
# Start windows/panes in current directory
set -g detach-on-destroy off

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind f display-popup -E -w 80% -h 80% -d "#{pane_current_path}" -b rounded -S "fg=#fe8019" -T " floating shell "

# Navigate panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Vim keys in copy mode and tmux prompts
setw -g mode-keys vi
set -g status-keys vi

# Mouse mode
set -g mouse on

# Copy mode: v starts selection, y copies to Windows clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"

# Window indexing starts at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Reload config
bind r source-file ~/.tmux.conf

# Windows
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind w list-windows

# True colors support
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"
set -g focus-events on

# Minimal status bar: windows on left, active pane's folder on right
set -g status-position bottom
set -g status-style "bg=#1c1c1c,fg=#a8a8a8"
set -g status-justify left
set -g status-left-length 0
set -g status-right-length 40
set -g status-left ""
set -g window-status-separator " "
set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #I:#W#F "
set -g window-status-style "bg=#1c1c1c,fg=#a8a8a8"
set -g window-status-current-style "bg=#303030,fg=#eeeeee,bold"
set -g status-right "#[bg=#b2b2b2,fg=#1c1c1c,bold] #{b:pane_current_path} "

# Borders
set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-style fg=#665c54
set -g pane-active-border-style fg=#a89984
